name: Build Bazionweb staging images

on:
  workflow_dispatch:
    inputs:
      bazionweb_commit:
        description: Full 40-character commit SHA from bazionwebs/bazionweb
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-bazionweb-staging-${{ inputs.bazionweb_commit }}
  cancel-in-progress: false

jobs:
  validate-bazionweb:
    name: Validate the pinned Bazionweb commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bazionweb_test
          POSTGRES_USER: bazionweb
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bazionweb -d bazionweb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bazionweb:testpassword@localhost:5432/bazionweb_test
      DATABASE_URL_UNPOOLED: postgresql://bazionweb:testpassword@localhost:5432/bazionweb_test
      BAZIONWEB_TEST_DATABASE_URL: postgresql://bazionweb:testpassword@localhost:5432/bazionweb_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-test-jwt-secret-minimum-32-characters

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Validate release ref and required GitHub App settings
        id: source
        env:
          SOURCE_SHA: ${{ inputs.bazionweb_commit }}
          APP_CLIENT_ID: ${{ vars.BAZIONWEB_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BAZIONWEB_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Enter the full 40-character Bazionweb commit SHA."
            exit 1
          fi
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Configure BAZIONWEB_APP_CLIENT_ID (Actions variable) and BAZIONWEB_APP_PRIVATE_KEY (Actions secret) in the Platform repository."
            exit 1
          fi
          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Create a repository-scoped read-only checkout token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BAZIONWEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BAZIONWEB_APP_PRIVATE_KEY }}
          owner: bazionwebs
          repositories: bazionweb
          permission-contents: read

      - name: Check out the exact Bazionweb commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: bazionwebs/bazionweb
          ref: ${{ steps.source.outputs.sha }}
          path: bazionweb
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Confirm checkout matches the requested commit
        working-directory: bazionweb
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bazionweb/package-lock.json

      - name: Install Bazionweb dependencies
        working-directory: bazionweb
        run: npm ci --ignore-scripts

      - name: Validate staging deployment configuration
        working-directory: bazionweb
        run: npm run test:deployment-config

      - name: Lint and typecheck Bazionweb applications
        working-directory: bazionweb
        run: |
          npm --workspace=@bazionweb/web run lint
          npm --workspace=@bazionweb/web run tsc
          npm --workspace=@bazionweb/api run prisma:generate
          npm run check:invariants
          npm --workspace=@bazionweb/api run lint
          npm --workspace=@bazionweb/api run tsc

      - name: Apply Bazionweb test database migrations
        working-directory: bazionweb
        run: npm --workspace=@bazionweb/api run prisma:migrate

      - name: Run Bazionweb web and API tests
        working-directory: bazionweb
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        run: |
          npm --workspace=@bazionweb/web test -- --coverage --passWithNoTests
          npm --workspace=@bazionweb/api run test:cov -- --passWithNoTests

  publish-images:
    name: Publish commit-addressed GHCR images
    needs: validate-bazionweb
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            build_args: ""
          - app: web
            dockerfile: apps/web/Dockerfile
            build_args: |
              NEXT_PUBLIC_APP_URL=https://staging.bazionweb.com
              NEXT_PUBLIC_PLATFORM_APP_URL=https://platform-staging.bazionweb.com
    steps:
      - name: Create a repository-scoped read-only checkout token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BAZIONWEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BAZIONWEB_APP_PRIVATE_KEY }}
          owner: bazionwebs
          repositories: bazionweb
          permission-contents: read

      - name: Check out the validated Bazionweb commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: bazionwebs/bazionweb
          ref: ${{ needs.validate-bazionweb.outputs.source_sha }}
          path: bazionweb
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Platform-owned GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the validated image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bazionweb
          file: bazionweb/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bazionweb-${{ matrix.app }}:sha-${{ needs.validate-bazionweb.outputs.source_sha }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate-bazionweb.outputs.source_sha }}
          cache-from: type=gha,scope=bazionweb-${{ matrix.app }}
          cache-to: type=gha,scope=bazionweb-${{ matrix.app }},mode=max
          provenance: mode=max
          sbom: true

      - name: Record commit-addressed image reference and registry digest
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/bazionweb-${{ matrix.app }}:sha-${{ needs.validate-bazionweb.outputs.source_sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Registry digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
