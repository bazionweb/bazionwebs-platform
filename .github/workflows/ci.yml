name: Validate Bazion platform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Validation is read-only. Dependencies are installed from the committed lockfile;
# CI must never create or push commits back into a contributor's branch.
permissions:
  contents: read

# PR runs are grouped by PR number so pushes to the same PR serialize.
# Do not cancel an active run: migrations, tests and builds should finish and
# report their result. A newer pending run may replace an older pending run.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Install, migrate, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bazion_app:bazion_app_local_only@localhost:5432/bazion_platform
      TENANT_ISOLATION_TEST_DATABASE_URL: postgres://bazion_app:bazion_app_local_only@localhost:5432/bazion_platform
      MIGRATION_DATABASE_URL: postgres://bazion_migrator:bazion_migrator_local_only@localhost:5432/bazion_platform
      AUTH_DATABASE_URL: postgres://bazion_auth_runtime:bazion_auth_local_only@localhost:5432/bazion_platform
      AUTH_MIGRATION_DATABASE_URL: postgres://bazion_migrator:bazion_migrator_local_only@localhost:5432/bazion_platform
      TENANT_RESOLVER_DATABASE_URL: postgres://bazion_tenant_resolver:bazion_tenant_resolver_local_only@localhost:5432/bazion_platform
      TENANT_PROVISIONER_DATABASE_URL: postgres://bazion_tenant_provisioner:bazion_tenant_provisioner_local_only@localhost:5432/bazion_platform
      NOTIFICATION_ENQUEUER_DATABASE_URL: postgres://bazion_notification_enqueuer:bazion_notification_enqueuer_local_only@localhost:5432/bazion_platform
      NOTIFICATION_WORKER_DATABASE_URL: postgres://bazion_notification_worker:bazion_notification_worker_local_only@localhost:5432/bazion_platform
      HOSTING_RECONCILER_DATABASE_URL: postgres://bazion_hosting_reconciler:bazion_hosting_reconciler_local_only@localhost:5432/bazion_platform
      PRODUCT_PROVISIONER_DATABASE_URL: postgres://bazion_product_provisioner:bazion_product_provisioner_local_only@localhost:5432/bazion_platform
      BAZION_HOSTING_RECONCILER_PASSWORD: bazion_hosting_reconciler_local_only
      BAZION_PRODUCT_PROVISIONER_PASSWORD: bazion_product_provisioner_local_only
      TENANT_BACKUP_DATABASE_URL: postgres://bazion_tenant_backup:bazion_tenant_backup_local_only@localhost:5432/bazion_platform
      BAZION_TENANT_BACKUP_PASSWORD: bazion_tenant_backup_local_only
      NOTIFICATION_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ci-only-bazion-auth-secret-that-is-long-enough-2026
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
      AUTH_APP_URL: http://localhost:3000
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      AUTH_INTEGRATION_TESTS: "1"
      DEFAULT_TENANT_CURRENCY: KES
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000
      PUBLIC_STOREFRONT_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      DEV_PAYMENT_SECRET: ci-only-dev-payment-secret
      COMMERCIAL_PROVISIONING_ENABLED: "false"
      COMMERCIAL_PROVISIONING_WORKER_ENABLED: "false"
      PRIVATE_ARCHIVE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TRUST_PROXY: "false"
      TRUSTED_PROXY_ADDRESSES: ""

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Install workspace dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate catalogue, module, solution, template and product manifests
        run: pnpm catalog:validate

      - name: Start PostgreSQL with least-privilege roles
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U bazion_admin -d bazion_platform; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Apply application database migrations
        run: |
          pnpm --filter @bazion/database migrate
          pnpm --filter @bazion/database migrate

      - name: Apply matching Better Auth schema
        run: pnpm --filter @bazion/auth migrate

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run unit, authentication and tenant-isolation tests
        run: pnpm test

      - name: Run gated cross-repo commercial-platform E2E suite (when sibling bazionweb test DB is configured)
        if: env.BAZIONWEB_TEST_DATABASE_URL != '' && env.BAZIONWEB_API_DIR != ''
        env:
          MIGRATION_DATABASE_URL: ${{ vars.MIGRATION_DATABASE_URL || 'postgresql://bazion_admin:bazion_dev_only@127.0.0.1:5432/bazion_platform' }}
          PRODUCT_PROVISIONER_DATABASE_URL: ${{ vars.PRODUCT_PROVISIONER_DATABASE_URL || 'postgresql://bazion_product_provisioner:bazion_product_provisioner_dev_only@127.0.0.1:5432/bazion_platform' }}
          BAZIONWEB_TEST_DATABASE_URL: ${{ secrets.BAZIONWEB_TEST_DATABASE_URL }}
          BAZIONWEB_API_DIR: ${{ vars.BAZIONWEB_API_DIR }}
        run: pnpm --filter @bazion/api exec vitest run src/modules/commercial-provisioning/cross-repo-e2e.integration.test.ts

      - name: Build all applications and packages
        run: pnpm build
