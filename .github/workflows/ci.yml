name: Validate Bazion platform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Validation is read-only. Dependencies are installed from the committed lockfile;
# CI must never create or push commits back into a contributor's branch.
permissions:
  contents: read

# PR runs are grouped by PR number so pushes to the same PR serialize.
# Do not cancel an active run: migrations, tests and builds should finish and
# report their result. A newer pending run may replace an older pending run.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Install, migrate, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://bazion_app:bazion_app_local_only@localhost:5432/bazion_platform
      TENANT_ISOLATION_TEST_DATABASE_URL: postgres://bazion_app:bazion_app_local_only@localhost:5432/bazion_platform
      MIGRATION_DATABASE_URL: postgres://bazion_migrator:bazion_migrator_local_only@localhost:5432/bazion_platform
      AUTH_DATABASE_URL: postgres://bazion_auth_runtime:bazion_auth_local_only@localhost:5432/bazion_platform
      AUTH_MIGRATION_DATABASE_URL: postgres://bazion_migrator:bazion_migrator_local_only@localhost:5432/bazion_platform
      TENANT_RESOLVER_DATABASE_URL: postgres://bazion_tenant_resolver:bazion_tenant_resolver_local_only@localhost:5432/bazion_platform
      TENANT_PROVISIONER_DATABASE_URL: postgres://bazion_tenant_provisioner:bazion_tenant_provisioner_local_only@localhost:5432/bazion_platform
      NOTIFICATION_ENQUEUER_DATABASE_URL: postgres://bazion_notification_enqueuer:bazion_notification_enqueuer_local_only@localhost:5432/bazion_platform
      NOTIFICATION_WORKER_DATABASE_URL: postgres://bazion_notification_worker:bazion_notification_worker_local_only@localhost:5432/bazion_platform
      HOSTING_RECONCILER_DATABASE_URL: postgres://bazion_hosting_reconciler:bazion_hosting_reconciler_local_only@localhost:5432/bazion_platform
      PRODUCT_PROVISIONER_DATABASE_URL: postgres://bazion_product_provisioner:bazion_product_provisioner_local_only@localhost:5432/bazion_platform
      BAZION_HOSTING_RECONCILER_PASSWORD: bazion_hosting_reconciler_local_only
      BAZION_PRODUCT_PROVISIONER_PASSWORD: bazion_product_provisioner_local_only
      TENANT_BACKUP_DATABASE_URL: postgres://bazion_tenant_backup:bazion_tenant_backup_local_only@localhost:5432/bazion_platform
      BAZION_TENANT_BACKUP_PASSWORD: bazion_tenant_backup_local_only
      NOTIFICATION_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_SECRET: ci-only-bazion-auth-secret-that-is-long-enough-2026
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:4000
      AUTH_APP_URL: http://localhost:3000
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
      AUTH_INTEGRATION_TESTS: "1"
      DEFAULT_TENANT_CURRENCY: KES
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000
      PUBLIC_STOREFRONT_URL: http://localhost:3000
      PAYMENT_PROVIDER: mock
      DEV_PAYMENT_SECRET: ci-only-dev-payment-secret
      COMMERCIAL_PROVISIONING_ENABLED: "false"
      COMMERCIAL_PROVISIONING_WORKER_ENABLED: "false"
      PRIVATE_ARCHIVE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TRUST_PROXY: "false"
      TRUSTED_PROXY_ADDRESSES: ""
      BAZIONWEB_TEST_DATABASE_URL: postgresql://bazionweb:testpassword@127.0.0.1:5433/bazionweb_test
      BAZIONWEB_API_DIR: ${{ vars.BAZIONWEB_API_DIR || '.bazionweb/apps/api' }}
      BAZIONWEB_REPO: ${{ vars.BAZIONWEB_REPO || 'bazionwebs/bazionweb' }}
      BAZIONWEB_REPO_REF: ${{ vars.BAZIONWEB_REPO_REF || 'main' }}

    steps:
      - name: Validate sibling Bazionweb repository and GitHub App credentials
        id: bazionweb-repo
        env:
          BAZIONWEB_APP_CLIENT_ID: ${{ vars.BAZIONWEB_APP_CLIENT_ID }}
          BAZIONWEB_APP_PRIVATE_KEY: ${{ secrets.BAZIONWEB_APP_PRIVATE_KEY }}
          BAZIONWEB_REPO: ${{ env.BAZIONWEB_REPO }}
        run: |
          if [ -z "$BAZIONWEB_APP_CLIENT_ID" ] || [ -z "$BAZIONWEB_APP_PRIVATE_KEY" ]; then
            echo "::error::Configure BAZIONWEB_APP_CLIENT_ID as an Actions variable and BAZIONWEB_APP_PRIVATE_KEY as an Actions secret in the Platform repository."
            exit 1
          fi
          if [[ ! "$BAZIONWEB_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::BAZIONWEB_REPO must have the form owner/repository."
            exit 1
          fi
          printf 'owner=%s\n' "${BAZIONWEB_REPO%%/*}" >> "$GITHUB_OUTPUT"
          printf 'name=%s\n' "${BAZIONWEB_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Check out pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create read-only token for the Bazionweb repository
        id: bazionweb-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BAZIONWEB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BAZIONWEB_APP_PRIVATE_KEY }}
          owner: ${{ steps.bazionweb-repo.outputs.owner }}
          repositories: ${{ steps.bazionweb-repo.outputs.name }}
          permission-contents: read

      - name: Check out sibling Bazionweb repository for contract parity and joint E2E
        uses: actions/checkout@v6
        with:
          repository: ${{ env.BAZIONWEB_REPO }}
          ref: ${{ env.BAZIONWEB_REPO_REF }}
          path: .bazionweb
          token: ${{ steps.bazionweb-app-token.outputs.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Install workspace dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Validate catalogue, module, solution, template and product manifests
        run: pnpm catalog:validate

      - name: Verify cross-repository contract schema and fixture parity
        run: pnpm contracts:verify-cross-repo

      - name: Start PostgreSQL with least-privilege roles
        run: |
          docker compose up -d db
          for attempt in {1..30}; do
            if docker compose exec -T db pg_isready -U bazion_admin -d bazion_platform; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Apply application database migrations
        run: |
          pnpm --filter @bazion/database migrate
          pnpm --filter @bazion/database migrate

      - name: Apply matching Better Auth schema
        run: pnpm --filter @bazion/auth migrate

      - name: Start isolated Bazionweb test PostgreSQL and apply Prisma migrations
        run: |
          node --input-type=module -e '
            const databaseUrl = new URL(process.env.BAZIONWEB_TEST_DATABASE_URL);
            if (databaseUrl.hostname !== "127.0.0.1" || databaseUrl.port !== "5433" || databaseUrl.pathname !== "/bazionweb_test") {
              console.error("CI must use the isolated local bazionweb_test database on 127.0.0.1:5433.");
              process.exit(1);
            }
          '
          docker run -d --name bazionweb-db-test -p 127.0.0.1:5433:5432 \
            -e POSTGRES_USER=bazionweb \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=bazionweb_test \
            postgres:16-alpine
          for attempt in {1..30}; do
            if docker exec bazionweb-db-test pg_isready -U bazionweb -d bazionweb_test; then
              break
            fi
            sleep 2
          done
          npm --prefix .bazionweb ci --ignore-scripts
          DATABASE_URL="$BAZIONWEB_TEST_DATABASE_URL" DATABASE_URL_UNPOOLED="$BAZIONWEB_TEST_DATABASE_URL" npm --prefix .bazionweb --workspace=@bazionweb/api run prisma:migrate
          DATABASE_URL="$BAZIONWEB_TEST_DATABASE_URL" npm --prefix .bazionweb --workspace=@bazionweb/api run prisma:generate

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run unit, authentication and tenant-isolation tests
        run: pnpm test

      - name: Run joint cross-repo commercial-platform PostgreSQL E2E suite
        env:
          REQUIRE_CROSS_REPO_E2E: "true"
        run: pnpm --filter @bazion/api test:cross-repo

      - name: Build all applications and packages
        run: pnpm build

  publish-container-images:
    name: Build and publish ${{ matrix.image }} image
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: api
            image: api
          - target: admin
            image: admin
          - target: storefront
            image: storefront
          - target: migrate
            image: migrate
    steps:
      - name: Check out validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging,enable={{is_default_branch}}

      - name: Build and publish image with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=bazion-platform-${{ matrix.image }}
          cache-to: type=gha,scope=bazion-platform-${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true
