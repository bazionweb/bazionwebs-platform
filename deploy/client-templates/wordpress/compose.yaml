services:
  db:
    image: ${MARIADB_IMAGE:?Set a tested MariaDB image tag or digest}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?Set a unique database name}
      MARIADB_USER: ${MARIADB_USER:?Set a unique database user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set a strong database password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set a strong database root password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MARIADB_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1024m
    cpus: 0.75
    stop_grace_period: 1m

  wordpress:
    image: ${WORDPRESS_IMAGE:?Set a tested WordPress image tag or digest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:?Set a unique database name}
      WORDPRESS_DB_USER: ${MARIADB_USER:?Set a unique database user}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:?Set a strong database password}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
        define('DISALLOW_FILE_EDIT', true);
        define('WP_MEMORY_LIMIT', '128M');
        define('WP_MAX_MEMORY_LIMIT', '256M');
    volumes:
      - db_data:/var/lib/mysql
      - wordpress_content:/var/www/html/wp-content
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 1m

volumes:
  db_data:
  wordpress_content:
